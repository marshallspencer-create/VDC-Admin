<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Dégradé de fond sombre profond -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <!-- Lueur dorée -->
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0"/>
    </radialGradient>
    <!-- Dégradé or -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Fond arrondi -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Lueur dorée en arrière-plan -->
  <circle cx="256" cy="180" r="200" fill="url(#glow)"/>

  <!-- Chérubin gauche (ailes + auréole) -->
  <g transform="translate(90, 150)">
    <!-- Ailes gauche -->
    <path d="M-20,60 C-50,20 -80,-10 -60,-40 C-40,-10 -20,10 -10,20 Z" fill="#fbbf24" opacity="0.7"/>
    <path d="M-10,50 C-30,10 -50,-20 -30,-45 C-10,-20 0,0 5,15 Z" fill="#fef3c7" opacity="0.5"/>
    <!-- Corps -->
    <ellipse cx="0" cy="60" rx="18" ry="25" fill="#fef3c7" opacity="0.9"/>
    <!-- Tête -->
    <circle cx="0" cy="30" r="14" fill="#fef3c7"/>
    <!-- Auréole -->
    <ellipse cx="0" cy="15" rx="18" ry="6" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.8"/>
    <!-- Mains en prière -->
    <path d="M-8,70 Q-15,65 -5,55 Q-2,60 -5,68" stroke="#fef3c7" stroke-width="2" fill="none"/>
    <path d="M8,70 Q15,65 5,55 Q2,60 5,68" stroke="#fef3c7" stroke-width="2" fill="none"/>
  </g>

  <!-- Chérubin droit (ailes + auréole, inversé) -->
  <g transform="translate(422, 150) scale(-1,1)">
    <!-- Ailes -->
    <path d="M-20,60 C-50,20 -80,-10 -60,-40 C-40,-10 -20,10 -10,20 Z" fill="#fbbf24" opacity="0.7"/>
    <path d="M-10,50 C-30,10 -50,-20 -30,-45 C-10,-20 0,0 5,15 Z" fill="#fef3c7" opacity="0.5"/>
    <!-- Corps -->
    <ellipse cx="0" cy="60" rx="18" ry="25" fill="#fef3c7" opacity="0.9"/>
    <!-- Tête -->
    <circle cx="0" cy="30" r="14" fill="#fef3c7"/>
    <!-- Auréole -->
    <ellipse cx="0" cy="15" rx="18" ry="6" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.8"/>
    <!-- Mains en prière -->
    <path d="M-8,70 Q-15,65 -5,55 Q-2,60 -5,68" stroke="#fef3c7" stroke-width="2" fill="none"/>
    <path d="M8,70 Q15,65 5,55 Q2,60 5,68" stroke="#fef3c7" stroke-width="2" fill="none"/>
  </g>

  <!-- Partition musicale (arc de cercle en haut) -->
  <g transform="translate(256, 100)">
    <!-- Portée : 5 lignes courbes -->
    <path d="M-80,0 Q-40,-20 0,-10 Q40,0 80,-10" stroke="#fbbf24" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M-80,6 Q-40,-14 0,-4 Q40,6 80,-4" stroke="#fbbf24" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M-80,12 Q-40,-8 0,2 Q40,12 80,2" stroke="#fbbf24" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M-80,18 Q-40,-2 0,8 Q40,18 80,8" stroke="#fbbf24" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M-80,24 Q-40,4 0,14 Q40,24 80,14" stroke="#fbbf24" stroke-width="1" fill="none" opacity="0.6"/>
    
    <!-- Notes de musique sur la portée -->
    <!-- Note 1 (croche) -->
    <ellipse cx="-50" cy="-5" rx="5" ry="3.5" fill="#fbbf24" transform="rotate(-20,-50,-5)"/>
    <line x1="-45" y1="-5" x2="-45" y2="-25" stroke="#fbbf24" stroke-width="1.5"/>
    <path d="M-45,-25 Q-35,-20 -38,-10" stroke="#fbbf24" stroke-width="1.5" fill="none"/>
    
    <!-- Note 2 (double croche) -->
    <ellipse cx="0" cy="8" rx="5" ry="3.5" fill="#fef3c7" transform="rotate(0,0,8)"/>
    <line x1="5" y1="8" x2="5" y2="-12" stroke="#fef3c7" stroke-width="1.5"/>
    <line x1="13" y1="6" x2="13" y2="-10" stroke="#fef3c7" stroke-width="1.5"/>
    <line x1="5" y1="-12" x2="13" y2="-10" stroke="#fef3c7" stroke-width="1.5"/>
    
    <!-- Note 3 (noire) -->
    <ellipse cx="60" cy="-3" rx="5" ry="3.5" fill="#fbbf24" transform="rotate(15,60,-3)"/>
    <line x1="65" y1="-3" x2="65" y2="-23" stroke="#fbbf24" stroke-width="1.5"/>
  </g>

  <!-- Couronne principale au centre -->
  <g transform="translate(256, 190)">
    <path d="M-70,30 L-50,-30 L-25,-10 L0,-40 L25,-10 L50,-30 L70,30 Z" fill="url(#gold)" stroke="#d97706" stroke-width="2.5"/>
    <circle cx="0" cy="-25" r="8" fill="#fef3c7"/>
    <!-- Base de la couronne -->
    <rect x="-75" y="28" width="150" height="8" rx="4" fill="#d97706"/>
  </g>

  <!-- Texte VDC -->
  <text x="256" y="310" font-size="85" font-weight="900" text-anchor="middle" fill="url(#goldLight)" font-family="Georgia, 'Times New Roman', serif" letter-spacing="12">VDC</text>
  
  <!-- Texte ADMIN -->
  <text x="256" y="365" font-size="28" font-weight="400" text-anchor="middle" fill="#94a3b8" font-family="Georgia, 'Times New Roman', serif" letter-spacing="18">ADMIN</text>

  <!-- Ligne décorative sous le texte -->
  <line x1="180" y1="385" x2="332" y2="385" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Sous-titre -->
  <text x="256" y="420" font-size="16" font-weight="300" text-anchor="middle" fill="#64748b" font-family="Georgia, 'Times New Roman', serif" letter-spacing="4">LA VOIX DES CHÉRUBINS</text>

  <!-- Partitions décoratives en bas -->
  <g transform="translate(130, 460)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#fbbf24" stroke-width="0.8" opacity="0.3"/>
    <line x1="0" y1="5" x2="80" y2="5" stroke="#fbbf24" stroke-width="0.8" opacity="0.3"/>
    <line x1="0" y1="10" x2="80" y2="10" stroke="#fbbf24" stroke-width="0.8" opacity="0.3"/>
    <circle cx="20" cy="2" r="3" fill="#fbbf24" opacity="0.3"/>
    <circle cx="60" cy="8" r="3" fill="#fbbf24" opacity="0.3"/>
  </g>
  <g transform="translate(302, 460)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#fbbf24" stroke-width="0.8" opacity="0.3"/>
    <line x1="0" y1="5" x2="80" y2="5" stroke="#fbbf24" stroke-width="0.8" opacity="0.3"/>
    <line x1="0" y1="10" x2="80" y2="10" stroke="#fbbf24" stroke-width="0.8" opacity="0.3"/>
    <circle cx="20" cy="2" r="3" fill="#fbbf24" opacity="0.3"/>
    <circle cx="60" cy="8" r="3" fill="#fbbf24" opacity="0.3"/>
  </g>

  <!-- Rayons lumineux subtils -->
  <line x1="256" y1="140" x2="150" y2="80" stroke="#fef3c7" stroke-width="0.5" opacity="0.15"/>
  <line x1="256" y1="140" x2="362" y2="80" stroke="#fef3c7" stroke-width="0.5" opacity="0.15"/>
  <line x1="256" y1="140" x2="100" y2="140" stroke="#fef3c7" stroke-width="0.5" opacity="0.15"/>
  <line x1="256" y1="140" x2="412" y2="140" stroke="#fef3c7" stroke-width="0.5" opacity="0.15"/>
</svg>