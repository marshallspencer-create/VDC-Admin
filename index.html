<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VDC Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial; background: #1e293b; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #334155; padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: white; font-size: 16px; box-sizing: border-box; }
        button { background: #3b82f6; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
        .link { color: #93c5fd; cursor: pointer; text-align: center; display: block; margin-top: 10px; }
        .hidden { display: none; }
        .card { background: #475569; padding: 15px; border-radius: 8px; margin: 10px 0; }
        h2 { text-align: center; color: #fbbf24; }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="container">
        <h2>🔐 VDC Admin</h2>
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPassword" placeholder="Mot de passe">
        <button onclick="handleLogin()">Se connecter</button>
        <span class="link" onclick="showRegister()">Créer un compte</span>
    </div>
</div>

<div id="registerScreen" class="hidden">
    <div class="container">
        <h2>📝 Inscription</h2>
        <input type="text" id="regName" placeholder="Nom et Prénom">
        <select id="regPoste">
            <option value="">Choisir le poste</option>
            <option>Maître de chœur</option>
            <option>Membre du bureau</option>
        </select>
        <input type="email" id="regEmail" placeholder="Email">
        <input type="password" id="regPassword" placeholder="Mot de passe (6+ caractères)">
        <button onclick="handleRegister()">S'inscrire</button>
        <span class="link" onclick="showLogin()">Déjà un compte ? Se connecter</span>
    </div>
</div>

<div id="appScreen" class="hidden">
    <div class="container">
        <h2>✅ Connecté !</h2>
        <p>Bienvenue sur VDC Admin</p>
        <button onclick="handleLogout()">Déconnexion</button>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://tcyigckknvytckizymii.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjeWlnY2trbnZ5dGNraXp5bWlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNTYxMjYsImV4cCI6MjEwMTYzMjEyNn0.9nUkUOUeQgzsacH6bBIRY3Q6G23XaqkS3qqmdQK6IJ8';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function showRegister() {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('registerScreen').classList.remove('hidden');
}
function showLogin() {
    document.getElementById('registerScreen').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
}

async function handleLogin() {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) { alert('Remplis tous les champs'); return; }
    
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) {
        alert('Erreur : ' + error.message);
    } else {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('registerScreen').classList.add('hidden');
        document.getElementById('appScreen').classList.remove('hidden');
    }
}

async function handleRegister() {
    const name = document.getElementById('regName').value;
    const poste = document.getElementById('regPoste').value;
    const email = document.getElementById('regEmail').value;
    const password = document.getElementById('regPassword').value;
    
    if (!name || !poste || !email || !password) { alert('Remplis tous les champs'); return; }
    if (password.length < 6) { alert('Mot de passe : 6 caractères minimum'); return; }
    
    const { data, error } = await supabase.auth.signUp({ email, password });
    if (error) {
        alert('Erreur : ' + error.message);
    } else {
        await supabase.from('profiles').upsert({
            id: data.user.id, full_name: name, poste: poste, email: email
        });
        alert('✅ Compte créé ! Connecte-toi maintenant.');
        showLogin();
    }
}

async function handleLogout() {
    await supabase.auth.signOut();
    document.getElementById('appScreen').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
}

// Vérifier si déjà connecté
(async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('appScreen').classList.remove('hidden');
    }
})();
</script>
</body>
</html>
