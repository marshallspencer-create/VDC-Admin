<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>VDC Admin</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VDC Admin">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="apple-touch-icon" href="logo.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #f8fafc; --text: #1e293b; }
        html.dark { --bg: #1e293b; --text: #e2e8f0; }
        body { background-color: var(--bg); color: var(--text); }
        .sidebar { transition: transform 0.3s ease; }
        @media (max-width: 1023px) {
            .sidebar { transform: translateX(-100%); position: fixed; z-index: 50; height: 100%; }
            .sidebar.open { transform: translateX(0); }
        }
        .modal { transition: opacity 0.2s ease; }
        .bottom-nav { background-color: #1e293b; }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #1e40af; font-weight: 600; }
        html.dark .tab-active { color: #93c5fd; border-color: #60a5fa; }
        html.dark .bg-white { background-color: #334155; }
        html.dark .text-gray-800, html.dark .text-slate-800 { color: #e2e8f0; }
        html.dark .text-gray-600 { color: #cbd5e1; }
        html.dark .text-gray-500 { color: #94a3b8; }
        html.dark .border { border-color: #475569; }
        html.dark .bg-gray-50 { background-color: #1e293b; }
        html.dark .bg-slate-800 { background-color: #0f172a; }
        html.dark .shadow-sm { box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.3); }
    </style>
</head>
<body class="font-sans antialiased" id="appBody">

<!-- Overlay mobile -->
<div id="sidebarOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden" onclick="toggleSidebar()"></div>

<!-- Sidebar -->
<aside id="sidebar" class="sidebar fixed top-0 left-0 h-full w-64 bg-slate-800 text-white flex flex-col shadow-xl z-50 lg:translate-x-0 lg:static lg:z-auto transform -translate-x-full">
    <div class="p-5 border-b border-slate-700">
        <h1 class="text-xl font-bold text-yellow-400 flex items-center gap-2"><i class="fas fa-crown"></i> VDC Admin</h1>
        <p class="text-xs text-slate-400 mt-1">Secrétariat & Maîtres de Chœur</p>
    </div>
    <nav class="flex-1 p-4 space-y-2" id="sidebarNav"></nav>
    <div class="p-4 border-t border-slate-700 text-xs text-slate-400">© 2025 · VDC Admin</div>
</aside>

<!-- Bottom nav -->
<nav class="bottom-nav fixed bottom-0 left-0 right-0 z-50 lg:hidden flex justify-around items-center py-2 border-t border-slate-700 text-white shadow-lg overflow-x-auto" id="bottomNav"></nav>

<main id="mainContent" class="lg:ml-64 min-h-screen pb-24 lg:pb-8 px-4 md:px-8 py-6 transition-all duration-300"></main>

<!-- Modal -->
<div id="modal" class="modal fixed inset-0 z-50 hidden items-center justify-center bg-black bg-opacity-60 p-4">
    <div class="bg-white dark:bg-slate-700 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
        <div class="p-6" id="modalContent"></div>
    </div>
</div>

<script>
// ---------- CONFIGURATION SUPABASE ----------
const SUPABASE_URL = 'https://tcyigckknvytckizymii.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjeWlnY2trbnZ5dGNraXp5bWlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNTYxMjYsImV4cCI6MjEwMTYzMjEyNn0.9nUkUOUeQgzsacH6bBIRY3Q6G23XaqkS3qqmdQK6IJ8';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------- ÉTAT ----------
let AppData = {
    members: [], events: [], attendances: [],
    repertoire: { 'Messes': [], 'Chants Communion': [], 'Offertoires': [], 'High life': [], 'Acclamations': [] },
    inventory: [], minutes: [], programme: [], massPrograms: []
};
let currentView = 'dashboard';
let selectedEventId = null;
let currentAttendance = {};
let currentRepertoireTab = 'Messes';
let currentSecretariatTab = 'attendance';
let user = null;

// ---------- DONNÉES SUPABASE ----------
async function loadData() {
    const { data, error } = await supabase.from('app_data').select('data').eq('id', 1).single();
    if (data && data.data) {
        AppData = data.data;
    }
    if (AppData.events.length > 0) selectedEventId = AppData.events[0].id;
    initAttendanceFromStorage();
}

async function saveAll() {
    if (!user) return;
    await supabase.from('app_data').upsert({ id: 1, data: AppData });
}

// Temps réel
supabase
    .channel('app_data_channel')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_data', filter: 'id=eq.1' }, (payload) => {
        if (payload.new && payload.new.data) {
            AppData = payload.new.data;
            if (AppData.events.length > 0) selectedEventId = AppData.events[0].id;
            initAttendanceFromStorage();
            renderView();
        }
    })
    .subscribe();

// ---------- AUTH ----------
async function login(email, password) {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) { alert('Erreur : ' + error.message); return; }
    user = data.user;
    await loadData();
    buildNavigation();
    navigateTo('dashboard');
}

async function register(email, password, fullName, poste) {
    const { data, error } = await supabase.auth.signUp({ email, password });
    if (error) { alert('Erreur : ' + error.message); return; }
    await supabase.from('profiles').upsert({
        id: data.user.id, full_name: fullName, poste: poste, email: email
    });
    alert('✅ Compte créé ! Vous pouvez maintenant vous connecter.');
    authMode = 'login';
    renderView();
}

async function logout() {
    await supabase.auth.signOut();
    user = null;
    buildNavigation();
    navigateTo('login');
}

async function checkSession() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session?.user) {
        user = session.user;
        await loadData();
    }
    buildNavigation();
    if (user) navigateTo('dashboard');
    else navigateTo('login');
}

// ---------- TRADUCTIONS ----------
const translations = {
    fr: {
        dashboard: "Tableau de bord", repertoire: "Répertoire", secretariat: "Secrétariat",
        mass: "Messe", settings: "Paramètres", login: "Connexion", register: "Inscription",
        logout: "Déconnexion", email: "Email", password: "Mot de passe",
        fullName: "Nom et Prénom", poste: "Poste", maitreChoeur: "Maître de chœur",
        membreBureau: "Membre du bureau", noAccount: "Pas de compte ? S'inscrire",
        alreadyAccount: "Déjà un compte ? Se connecter",
        add: "Ajouter", edit: "Modifier", save: "Enregistrer", cancel: "Annuler",
        delete: "Supprimer", close: "Fermer", noData: "Aucune donnée",
        attendance: "Liste de présence", events: "Événements", inventory: "Inventaire",
        pv: "Procès-Verbaux", programme: "Programme du jour",
        choirMembers: "Choristes", nextEvent: "Événement", repertoireCount: "chants",
        selectEvent: "Sélectionner un événement", addEventFirst: "Ajoutez d'abord un événement",
        fullNameLabel: "Nom et Prénom", pupitre: "Pupitre", situation: "Situation",
        motif: "Motif", present: "Présent", retard: "Retard", absent: "Absent",
        saveAttendance: "Enregistrer les présences", addMember: "Ajouter un membre",
        addEvent: "Ajouter un événement", editEvent: "Modifier un événement",
        addInventory: "Ajouter matériel", addPV: "Nouveau PV",
        addMass: "Ajouter un programme", editMass: "Modifier",
        addProgramme: "Ajouter un programme", editProgramme: "Modifier un programme",
        title: "Titre", details: "Détails", date: "Date", type: "Type",
        heure: "Heure", paroisse: "Paroisse", quartier: "Quartier",
        domaine: "Domaine", name: "Nom", quantity: "Quantité", condition: "État",
        new: "Neuf", good: "Bon état", damaged: "Endommagé",
        toReplace: "A remplacer", toRepair: "À réparer",
        eventType_messe: "Messe", eventType_concert: "Concert",
        eventType_rejouissances: "Réjouissances", eventType_classe: "Classe de chant",
        eventType_autre: "Autre",
        darkMode: "Mode sombre", themeSystem: "Système (auto)",
        themeLight: "Clair", themeDark: "Sombre",
        exportData: "Exporter", importData: "Importer", resetData: "Réinitialiser",
        importSuccess: "Données importées.", resetConfirm: "Tout effacer ?",
        confirmDelete: "Supprimer ce chant ?",
        programmeToday: "Programme du jour",
        massProcession: "Procession", massEntree: "Entrée", massKyrie: "Kyrie",
        massGloria: "Gloria", massPsaume: "Psaume", massAcclamation: "Acclamation",
        massEpiclese: "Épiclèse", massCredo: "Credo", massPU: "Prière universelle",
        massOffrande: "Offrande", massSanctus: "Sanctus", massAgnusDei: "Agnus Dei",
        massCommunion: "Communion", massQuete: "Quête construction", massEnvoi: "Envoi",
    }
};
let currentLang = 'fr';
function _(key) { return translations[currentLang]?.[key] || key; }

// ---------- THEME ----------
const themePref = localStorage.getItem('theme');
const systemDark = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
    let theme = themePref || 'system';
    let isDark = theme === 'system' ? systemDark.matches : theme === 'dark';
    document.documentElement.classList.toggle('dark', isDark);
}
systemDark.addEventListener('change', () => { if (!themePref || themePref === 'system') applyTheme(); });
function setTheme(theme) { localStorage.setItem('theme', theme); applyTheme(); }
applyTheme();

function initAttendanceFromStorage() {
    currentAttendance = {};
    if (!selectedEventId) return;
    AppData.attendances.filter(a => a.event_id === selectedEventId).forEach(a => {
        currentAttendance[a.member_id] = { status: a.status, motif: a.motif || '' };
    });
}

// ---------- NAVIGATION ----------
function buildNavigation() {
    if (!user) {
        document.getElementById('sidebarNav').innerHTML = '';
        document.getElementById('bottomNav').innerHTML = '';
        return;
    }
    const navItems = [
        { view: 'dashboard', icon: 'fa-th-large', i18n: 'dashboard' },
        { view: 'repertoire', icon: 'fa-book-open', i18n: 'repertoire' },
        { view: 'secretariat', icon: 'fa-briefcase', i18n: 'secretariat' },
        { view: 'mass', icon: 'fa-church', i18n: 'mass' },
        { view: 'settings', icon: 'fa-cog', i18n: 'settings' },
    ];
    document.getElementById('sidebarNav').innerHTML = navItems.map(item =>
        `<a href="#" onclick="navigateTo('${item.view}')" class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 transition-colors" data-view="${item.view}"><i class="fas ${item.icon} w-5 text-center"></i> <span>${_(item.i18n)}</span></a>`
    ).join('');
    document.getElementById('bottomNav').innerHTML = navItems.map(item =>
        `<button onclick="navigateTo('${item.view}')" class="flex flex-col items-center text-xs nav-item-mobile mx-1" data-view="${item.view}"><i class="fas ${item.icon} text-lg"></i> <span>${_(item.i18n)}</span></button>`
    ).join('');
}

function navigateTo(view) {
    currentView = view;
    renderView();
    if (!user) return;
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('bg-slate-700', 'text-yellow-400'));
    document.querySelectorAll('.nav-item-mobile').forEach(el => el.classList.remove('text-yellow-400'));
    const d = document.querySelector(`.nav-item[data-view="${view}"]`);
    const m = document.querySelector(`.nav-item-mobile[data-view="${view}"]`);
    if (d) d.classList.add('bg-slate-700', 'text-yellow-400');
    if (m) m.classList.add('text-yellow-400');
    if (window.innerWidth < 1024) {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.add('hidden');
    }
}

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('hidden'); }
function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarOverlay').classList.remove('hidden'); }

// ---------- RENDU PRINCIPAL ----------
function renderView() {
    const main = document.getElementById('mainContent');
    if (!user) {
        main.innerHTML = renderAuthScreen();
        return;
    }
    switch (currentView) {
        case 'dashboard': main.innerHTML = renderDashboard(); break;
        case 'repertoire': main.innerHTML = renderRepertoire(); break;
        case 'secretariat': main.innerHTML = renderSecretariat(); break;
        case 'mass': main.innerHTML = renderMassPage(); break;
        case 'settings': main.innerHTML = renderSettings(); break;
        default: main.innerHTML = renderDashboard();
    }
}

// ---------- ÉCRAN DE CONNEXION ----------
let authMode = 'login';
function renderAuthScreen() {
    return `
    <div class="flex items-center justify-center min-h-[70vh]">
        <div class="bg-white dark:bg-slate-700 rounded-xl shadow-lg p-6 max-w-sm w-full">
            <div class="text-center mb-6">
                <i class="fas fa-crown text-yellow-400 text-4xl mb-2"></i>
                <h2 class="text-xl font-bold">VDC Admin</h2>
                <p class="text-sm text-gray-500">${authMode === 'login' ? _('login') : _('register')}</p>
            </div>
            <form id="authForm" class="space-y-3">
                <input type="email" id="authEmail" placeholder="${_('email')}" required class="w-full border p-2 rounded dark:bg-slate-600 dark:border-slate-500">
                <input type="password" id="authPassword" placeholder="${_('password')}" required class="w-full border p-2 rounded dark:bg-slate-600 dark:border-slate-500">
                ${authMode === 'register' ? `
                    <input type="text" id="authFullName" placeholder="${_('fullName')}" required class="w-full border p-2 rounded dark:bg-slate-600 dark:border-slate-500">
                    <select id="authPoste" class="w-full border p-2 rounded dark:bg-slate-600 dark:border-slate-500" required>
                        <option value="">${_('poste')}</option>
                        <option value="Maître de chœur">${_('maitreChoeur')}</option>
                        <option value="Membre du bureau">${_('membreBureau')}</option>
                    </select>
                ` : ''}
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">${authMode === 'login' ? _('login') : _('register')}</button>
            </form>
            <p class="mt-3 text-sm text-center">
                ${authMode === 'login' ? 
                    `<a href="#" onclick="authMode='register'; renderView();" class="text-blue-600 hover:underline">${_('noAccount')}</a>` :
                    `<a href="#" onclick="authMode='login'; renderView();" class="text-blue-600 hover:underline">${_('alreadyAccount')}</a>`
                }
            </p>
        </div>
    </div>`;
}

document.addEventListener('submit', async function(e) {
    if (e.target.id === 'authForm') {
        e.preventDefault();
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        if (authMode === 'register') {
            const fullName = document.getElementById('authFullName').value;
            const poste = document.getElementById('authPoste').value;
            await register(email, password, fullName, poste);
        } else {
            await login(email, password);
        }
    }
});

// ---------- DASHBOARD ----------
function renderDashboard() {
    const nb = AppData.members.length;
    const nextEv = AppData.events.sort((a,b)=> new Date(a.event_date) - new Date(b.event_date)).find(e => new Date(e.event_date) >= new Date()) || AppData.events[AppData.events.length-1];
    const totalRep = Object.values(AppData.repertoire).flat().length;
    const today = new Date().toISOString().split('T')[0];
    const todayProg = AppData.programme.filter(p => p.date === today);
    return `
    <div class="mb-6 flex items-center justify-between">
        <h2 class="text-2xl font-bold">${_('dashboard')}</h2>
        <button onclick="openSidebar()" class="lg:hidden text-slate-700 dark:text-white text-2xl"><i class="fas fa-bars"></i></button>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
        <div class="bg-white dark:bg-slate-700 p-5 rounded-xl shadow-sm border dark:border-slate-600">
            <div class="flex items-center gap-3 text-blue-600"><i class="fas fa-users text-2xl"></i><span>${_('choirMembers')}</span></div>
            <p class="text-3xl font-bold mt-2">${nb}</p>
        </div>
        <div class="bg-white dark:bg-slate-700 p-5 rounded-xl shadow-sm border dark:border-slate-600">
            <div class="flex items-center gap-3 text-yellow-600"><i class="fas fa-calendar-alt text-2xl"></i><span>${_('nextEvent')}</span></div>
            <p class="text-xl font-bold mt-2">${nextEv?.title || _('noData')}</p>
            <p class="text-sm text-gray-500">${nextEv?.event_date || ''} - ${nextEv?.location || ''}</p>
        </div>
        <div class="bg-white dark:bg-slate-700 p-5 rounded-xl shadow-sm border dark:border-slate-600">
            <div class="flex items-center gap-3 text-green-600"><i class="fas fa-book-open text-2xl"></i><span>${_('repertoire')}</span></div>
            <p class="text-3xl font-bold mt-2">${totalRep} ${_('repertoireCount')}</p>
        </div>
    </div>
    <div class="bg-white dark:bg-slate-700 rounded-xl shadow-sm border dark:border-slate-600 p-4 mb-6">
        <div class="flex justify-between items-center mb-3">
            <h3 class="text-lg font-bold"><i class="fas fa-list-ul mr-2"></i>${_('programmeToday')} (${new Date().toLocaleDateString('fr-FR')})</h3>
            <button onclick="openAddProgrammeModal()" class="text-blue-600"><i class="fas fa-plus-circle"></i> ${_('add')}</button>
        </div>
        ${todayProg.length === 0 ? `<p class="text-gray-500 italic">${_('noData')}</p>` : todayProg.map(p => `
        <div class="flex justify-between items-center border-b dark:border-slate-500 py-2">
            <span><strong>${p.title}</strong> - ${p.details || ''}</span>
            <button onclick="deleteProgramme(${p.id})" class="text-red-500"><i class="fas fa-trash"></i></button>
        </div>`).join('')}
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <button onclick="navigateTo('secretariat')" class="bg-white dark:bg-slate-700 p-4 rounded-xl shadow-sm border dark:border-slate-600 hover:shadow-md text-left">
            <i class="fas fa-user-check text-blue-500 text-xl block mb-1"></i>${_('secretariat')}
        </button>
        <button onclick="navigateTo('repertoire')" class="bg-white dark:bg-slate-700 p-4 rounded-xl shadow-sm border dark:border-slate-600 hover:shadow-md text-left">
            <i class="fas fa-music text-green-500 text-xl block mb-1"></i>${_('repertoire')}
        </button>
        <button onclick="navigateTo('mass')" class="bg-white dark:bg-slate-700 p-4 rounded-xl shadow-sm border dark:border-slate-600 hover:shadow-md text-left">
            <i class="fas fa-church text-purple-500 text-xl block mb-1"></i>${_('mass')}
        </button>
        <button onclick="navigateTo('settings')" class="bg-white dark:bg-slate-700 p-4 rounded-xl shadow-sm border dark:border-slate-600 hover:shadow-md text-left">
            <i class="fas fa-cog text-indigo-500 text-xl block mb-1"></i>${_('settings')}
        </button>
    </div>`;
}

// ---------- RÉPERTOIRE ----------
function renderRepertoire() {
    const tabs = ['Messes', 'Chants Communion', 'Offertoires', 'High life', 'Acclamations'];
    const chants = AppData.repertoire[currentRepertoireTab] || [];
    const statusColors = {'A étudier':'bg-yellow-100 text-yellow-800','En cours':'bg-blue-100 text-blue-800','Maîtrisé':'bg-green-100 text-green-800','Archivé':'bg-gray-100 text-gray-600'};
    let html = `
    <div class="mb-6 flex items-center justify-between"><h2 class="text-2xl font-bold">${_('repertoire')}</h2><button onclick="openSidebar()" class="lg:hidden text-slate-700 dark:text-white text-2xl"><i class="fas fa-bars"></i></button></div>
    <div class="flex flex-wrap gap-2 mb-6 border-b dark:border-slate-600 pb-2">
        ${tabs.map(t => `<button onclick="currentRepertoireTab='${t}';renderView()" class="px-4 py-2 rounded-t-lg text-sm font-medium ${currentRepertoireTab === t ? 'tab-active bg-white dark:bg-slate-700 border-t border-l border-r dark:border-slate-600' : 'text-gray-500 hover:text-gray-700'}">${t}</button>`).join('')}
    </div>
    <div class="mb-4 flex justify-between items-center">
        <span class="text-sm text-gray-500">${chants.length} ${_('repertoireCount')}</span>
        <button onclick="openAddChantModal()" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-sm hover:bg-blue-700"><i class="fas fa-plus mr-1"></i> ${_('add')}</button>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">`;
    chants.forEach(chant => {
        html += `<div class="bg-white dark:bg-slate-700 rounded-xl shadow-sm border dark:border-slate-600 p-4 hover:shadow-md cursor-pointer" onclick="viewChantDetail(${chant.id}, '${currentRepertoireTab}')">
            <div class="flex justify-between"><h3 class="font-bold text-lg">${chant.title}</h3><span class="text-xs px-2 py-0.5 rounded-full ${statusColors[chant.status] || 'bg-gray-200'}">${chant.status}</span></div>
            <p class="text-sm text-gray-600 dark:text-gray-400">${chant.composer || ''}</p>
            <div class="flex justify-end mt-2"><button onclick="event.stopPropagation();deleteChant(${chant.id}, '${currentRepertoireTab}')" class="text-red-500 hover:text-red-700"><i class="fas fa-trash"></i></button></div>
        </div>`;
    });
    html += `</div>`;
    return html;
}
function deleteChant(chantId, tab) {
    if (confirm(_('confirmDelete'))) {
        AppData.repertoire[tab] = AppData.repertoire[tab].filter(c => c.id !== chantId);
        saveAll(); renderView();
    }
}
function openAddChantModal(editChant = null) {
    const chant = editChant || { title: '', composer: '', musical_key: '', status: 'A étudier', lyrics: '' };
    const modal = `
    <h2 class="text-xl font-bold mb-4">${editChant ? _('edit') : _('add')} un chant</h2>
    <form id="chantForm" class="space-y-3">
        <input type="text" name="title" placeholder="${_('title')}" value="${chant.title}" required class="w-full border p-2 rounded dark:bg-slate-600 dark:border-slate-500">

    saveAll(); alert(_('saveAttendance'));

    </form>`;

        e.preventDefault();
        const fd = new FormData(e.target);
        const newEv = {
            id: ev ? ev.id : Date.now(),
            title: ev ? fd.get('title') : `${fd.get('type')} du ${fd.get('event_date')}`,
            type: fd.get('type'), event_date: fd.get('event_date'), heure: fd.get('heure'),
            paroisse: fd.get('paroisse'), quartier: fd.get('quartier'), details: fd.get('details')
        };
        if (ev) { const idx = AppData.events.findIndex(e => e.id === ev.id); if (idx !== -1) AppData.events[idx] = newEv; }
        else AppData.events.push(newEv);
        if (!selectedEventId) selectedEventId = newEv.id;
        saveAll(); closeModal(); renderView();
    };
}
function deleteEvent(id) {
    if (confirm(_('confirmDelete'))) {
        AppData.events = AppData.events.filter(e => e.id !== id);

        if (selectedEventId === id) selectedEventId = AppData.events.length > 0 ? AppData.events[0].id : null;
        saveAll(); renderView();
    }
}

function openEditMassProgramModal(progId) {
    const prog = progId ? AppData.massPrograms.find(p => p.id === progId) : null;
    const data = prog || { date: new Date().toISOString().split('T')[0], title: '', procession: '', entree: '', kyrie: '', gloria: '', psaume: '', acclamation: '', epiclese: '', credo: '', pu: '', offrande: '', sanctus: '', agnus_dei: '', communion: '', quete_construction: '', envoi: '' };
    const fields = [['massProcession','procession'],['massEntree','entree'],['massKyrie','kyrie'],['massGloria','gloria'],['massPsaume','psaume'],['massAcclamation','acclamation'],['massEpiclese','epiclese'],['massCredo','credo'],['massPU','pu'],['massOffrande','offrande'],['massSanctus','sanctus'],['massAgnusDei','agnus_dei'],['massCommunion','communion'],['massQuete','quete_construction'],['massEnvoi','envoi']];
    const modal = `
    <h2 class="text-xl font-bold mb-4">${prog ? _('editMass') : _('addMass')}</h2>
    <form id="massForm" class="space-y-3">
        <div class="grid grid-cols-2 gap-2">
            <input type="date" name="date" value="${data.date}" required class="w-full border p-2 rounded dark:bg-slate-600">
            <input type="text" name="title" placeholder="${_('title')}" value="${data.title}" class="w-full border p-2 rounded dark:bg-slate-600">
        </div>
        <div class="space-y-2 text-sm">
            ${fields.map(([k,n]) => `<div><label class="block font-medium">🔥 ${_(k)}</label><input type="text" name="${n}" value="${data[n]||''}" class="w-full border p-2 rounded mt-1 dark:bg-slate-600"></div>`).join('')}
        </div>
        <div class="flex justify-end gap-3"><button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 dark:bg-slate-500 rounded">${_('cancel')}</button><button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded">${_('save')}</button></div>
    </form>`;
    openModal(modal);
    document.getElementById('massForm').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const newProg = { id: prog ? prog.id : Date.now(), date: fd.get('date'), title: fd.get('title') };
        fields.forEach(([_,n]) => newProg[n] = fd.get(n));
        if (prog) { const idx = AppData.massPrograms.findIndex(p=>p.id===prog.id); if(idx!==-1) AppData.massPrograms[idx] = newProg; }
        else AppData.massPrograms.push(newProg);
        saveAll(); closeModal(); renderView();
    };
}
function deleteMassProgram(id) {
    if (confirm(_('confirmDelete'))) { AppData.massPrograms = AppData.massPrograms.filter(p=>p.id!==id); saveAll(); renderView(); }
}

// ---------- PARAMÈTRES ----------
function renderSettings() {
    return `
    <div class="mb-6 flex items-center justify-between"><h2 class="text-2xl font-bold">${_('settings')}</h2><button onclick="openSidebar()" class="lg:hidden text-slate-700 dark:text-white text-2xl"><i class="fas fa-bars"></i></button></div>
    <div class="bg-white dark:bg-slate-700 rounded-xl shadow-sm border dark:border-slate-600 p-6 space-y-6 max-w-md">
        <div>
            <label class="block font-medium mb-2">${_('darkMode')}</label>
            <select id="themeSelect" onchange="setTheme(this.value)" class="border rounded p-2 w-full dark:bg-slate-600">
                <option value="system" ${(!themePref||themePref==='system')?'selected':''}>${_('themeSystem')}</option>
                <option value="light" ${themePref==='light'?'selected':''}>${_('themeLight')}</option>
                <option value="dark" ${themePref==='dark'?'selected':''}>${_('themeDark')}</option>
            </select>
        </div>
        <button onclick="exportAllData()" class="w-full bg-blue-600 text-white py-2 rounded mb-2"><i class="fas fa-download mr-2"></i>${_('exportData')}</button>
        <label class="w-full bg-gray-200 dark:bg-slate-500 py-2 rounded cursor-pointer block text-center"><i class="fas fa-upload mr-2"></i>${_('importData')}<input type="file" accept=".json" onchange="importAllData(this.files[0])" class="hidden"></label>
        <button onclick="resetAllData()" class="w-full bg-red-600 text-white py-2 rounded"><i class="fas fa-trash-alt mr-2"></i>${_('resetData')}</button>
        <button onclick="logout()" class="w-full bg-gray-600 text-white py-2 rounded"><i class="fas fa-sign-out-alt mr-2"></i>${_('logout')}</button>
    </div>`;
}

function exportAllData() {
    const blob = new Blob([JSON.stringify(AppData, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'vdc_backup.json';
    a.click();
}
function importAllData(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            if (data.members) AppData.members = data.members;
            if (data.events) AppData.events = data.events;
            if (data.attendances) AppData.attendances = data.attendances;
            if (data.repertoire) AppData.repertoire = data.repertoire;
            if (data.inventory) AppData.inventory = data.inventory;
            if (data.minutes) AppData.minutes = data.minutes;
            if (data.programme) AppData.programme = data.programme;
            if (data.massPrograms) AppData.massPrograms = data.massPrograms;
            saveAll(); loadData(); renderView();
            alert(_('importSuccess'));
        } catch(ex) { alert('Fichier invalide.'); }
    };
    reader.readAsText(file);
}
function resetAllData() {
    if (confirm(_('resetConfirm'))) {
        AppData = { members: [], events: [], attendances: [], repertoire: { 'Messes': [], 'Chants Communion': [], 'Offertoires': [], 'High life': [], 'Acclamations': [] }, inventory: [], minutes: [], programme: [], massPrograms: [] };
        saveAll(); renderView();
    }
}

// ---------- MODAL ----------
function openModal(content) { document.getElementById('modalContent').innerHTML = content; document.getElementById('modal').classList.remove('hidden'); document.getElementById('modal').classList.add('flex'); }
function closeModal() { document.getElementById('modal').classList.add('hidden'); document.getElementById('modal').classList.remove('flex'); }
document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

// ---------- INITIALISATION ----------
window.addEventListener('resize', () => {
    if (window.innerWidth >= 1024) {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.add('hidden');
    }
});

checkSession();
</script>
