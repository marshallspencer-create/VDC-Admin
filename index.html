<!-- Notification toast -->

<!-- Script de l'application -->
<script>
// ---------- SYSTÈME DE NOTIFICATIONS ----------
let notificationsEnabled = localStorage.getItem('notifications') === 'true';

function requestNotificationPermission() {
    if (!('Notification' in window)) {
        console.log('Notifications non supportées');
        return;
    }
    
    Notification.requestPermission().then(permission => {
        if (permission === 'granted') {
            notificationsEnabled = true;
            localStorage.setItem('notifications', 'true');
            showToast('Notifications activées', 'Vous recevrez des alertes pour les événements et modifications');
            scheduleEventReminders();
            scheduleProgrammeNotification();
        } else {
            notificationsEnabled = false;
            localStorage.setItem('notifications', 'false');
            showToast('Notifications désactivées', 'Vous pouvez les réactiver dans Paramètres');
        }
    });
}

function sendNotification(title, message, icon = '🔔') {
    // Notification système (navigateur)
    if (notificationsEnabled && Notification.permission === 'granted') {
        const notif = new Notification(title, {
            body: message,
            icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%231e293b"/><text x="50" y="65" font-size="50" font-weight="bold" text-anchor="middle" fill="%23fbbf24">VDC</text></svg>',
            badge: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%23fbbf24"/><text x="50" y="65" font-size="50" font-weight="bold" text-anchor="middle" fill="%231e293b">VDC</text></svg>',
            tag: 'vdc-notification',
            requireInteraction: false
        });
        
        setTimeout(() => notif.close(), 5000);
    }
    
    // Toast dans l'application
    showToast(title, message);
}

function showToast(title, message) {
    const toast = document.getElementById('notificationToast');
    document.getElementById('toastTitle').textContent = title;
    document.getElementById('toastMessage').textContent = message;
    toast.classList.remove('hidden', 'translate-x-[120%]');
    toast.classList.add('translate-x-0');
    
    setTimeout(() => {
        toast.classList.add('translate-x-[120%]');
        setTimeout(() => toast.classList.add('hidden'), 300);
    }, 4000);
}

// Notifier les modifications
function notifyChange(type, action, detail = '') {
    const types = {
        'chant': 'chant',
        'membre': 'choriste',
        'événement': 'événement',
        'présence': 'feuille de présence',
        'programme': 'programme du jour',
        'messe': 'programme de messe',
        'matériel': 'matériel',
        'pv': 'procès-verbal'
    };
    
    const actions = {
        'ajout': 'ajouté(e)',
        'modification': 'modifié(e)',
        'suppression': 'supprimé(e)'
    };
    
    const title = `✅ ${type.charAt(0).toUpperCase() + type.slice(1)} ${actions[action] || 'mis à jour'}`;
    const message = detail ? `${detail}` : `Un(e) ${types[type] || type} a été ${actions[action] || 'mis à jour'}.`;
    
    sendNotification(title, message);
}

// Rappels d'événements
function scheduleEventReminders() {
    if (!notificationsEnabled) return;
    
    const now = new Date();
    const tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate() + 1);
    const tomorrowStr = tomorrow.toISOString().split('T')[0];
    
    // Vérifier les événements de demain
    const tomorrowEvents = AppData.events.filter(ev => ev.event_date === tomorrowStr);
    
    tomorrowEvents.forEach(ev => {
        const eventTitle = ev.title || `${ev.type} du ${ev.event_date}`;
        const lieu = ev.paroisse ? ` à ${ev.paroisse}` : '';
        const heure = ev.heure ? ` à ${ev.heure}` : '';
        
        sendNotification(
            '📅 Rappel : Événement demain',
            `${eventTitle}${lieu}${heure}`
        );
    });
    
    // Vérifier les événements d'aujourd'hui
    const todayStr = now.toISOString().split('T')[0];
    const todayEvents = AppData.events.filter(ev => ev.event_date === todayStr);
    
    todayEvents.forEach(ev => {
        const eventTitle = ev.title || `${ev.type} du ${ev.event_date}`;
        const lieu = ev.paroisse ? ` à ${ev.paroisse}` : '';
        const heure = ev.heure ? ` à ${ev.heure}` : '';
        
        sendNotification(
            '📅 Aujourd\'hui !',
            `${eventTitle}${lieu}${heure}`
        );
    });
}

// Programme du jour
function scheduleProgrammeNotification() {
    if (!notificationsEnabled) return;
    
    const today = new Date().toISOString().split('T')[0];
    const todayProgramme = AppData.programme.filter(p => p.date === today);
    
    if (todayProgramme.length > 0) {
        const programmeList = todayProgramme.map(p => p.title).join(', ');
        sendNotification(
            '📋 Programme du jour',
            programmeList
        );
    }
}

// Vérifier les notifications toutes les heures
function checkNotifications() {
    scheduleEventReminders();
    scheduleProgrammeNotification();
}

// Lancer au démarrage
setTimeout(() => {
    if (notificationsEnabled) {
        checkNotifications();
        // Vérifier toutes les heures
        setInterval(checkNotifications, 3600000);
    }
}, 5000);

let currentLang = 'fr';
function _(key) { return translations[currentLang]?.[key] || key; }

// ---------- THEME ----------
const themePref = localStorage.getItem('theme');
const systemDark = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
    let theme = themePref || 'system';
    let isDark = theme === 'system' ? systemDark.matches : theme === 'dark';
    document.documentElement.classList.toggle('dark', isDark);
}
systemDark.addEventListener('change', () => { if (!themePref || themePref === 'system') applyTheme(); });
function setTheme(theme) { localStorage.setItem('theme', theme); applyTheme(); }
applyTheme();

// ---------- DONNÉES ----------
const STORAGE = {
    members: 'vdc_members', events: 'vdc_events', attendances: 'vdc_attendances',
    repertoire: 'vdc_repertoire', inventory: 'vdc_inventory', minutes: 'vdc_minutes',
    programme: 'vdc_programme', massPrograms: 'vdc_massPrograms'
};

let AppData = {
    members: [], events: [], attendances: [],
    repertoire: { 'Messes': [], 'Chants Communion': [], 'Offertoires': [], 'High life': [], 'Acclamations': [] },
    inventory: [], minutes: [], programme: [], massPrograms: []
};
let currentView = 'dashboard';
let selectedEventId = null;
let currentAttendance = {};
let currentRepertoireTab = 'Messes';
let currentSecretariatTab = 'attendance';

function loadData() {
    try {
        AppData.members = JSON.parse(localStorage.getItem(STORAGE.members)) || [];
        AppData.events = JSON.parse(localStorage.getItem(STORAGE.events)) || [];
        AppData.attendances = JSON.parse(localStorage.getItem(STORAGE.attendances)) || [];
        const rep = JSON.parse(localStorage.getItem(STORAGE.repertoire));
        AppData.repertoire = rep || { 'Messes': [], 'Chants Communion': [], 'Offertoires': [], 'High life': [], 'Acclamations': [] };
        AppData.inventory = JSON.parse(localStorage.getItem(STORAGE.inventory)) || [];
        AppData.minutes = JSON.parse(localStorage.getItem(STORAGE.minutes)) || [];
        AppData.programme = JSON.parse(localStorage.getItem(STORAGE.programme)) || [];
        AppData.massPrograms = JSON.parse(localStorage.getItem(STORAGE.massPrograms)) || [];
    } catch(e) {}
    if (AppData.events.length > 0) selectedEventId = AppData.events[0].id;
    initAttendanceFromStorage();
}

function saveAll() {
    localStorage.setItem(STORAGE.members, JSON.stringify(AppData.members));
    localStorage.setItem(STORAGE.events, JSON.stringify(AppData.events));
    localStorage.setItem(STORAGE.attendances, JSON.stringify(AppData.attendances));
    localStorage.setItem(STORAGE.repertoire, JSON.stringify(AppData.repertoire));
    localStorage.setItem(STORAGE.inventory, JSON.stringify(AppData.inventory));
    localStorage.setItem(STORAGE.minutes, JSON.stringify(AppData.minutes));
    localStorage.setItem(STORAGE.programme, JSON.stringify(AppData.programme));
    localStorage.setItem(STORAGE.massPrograms, JSON.stringify(AppData.massPrograms));
}

function exportAllData() {
    const blob = new Blob([JSON.stringify(AppData, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'vdc_backup.json';
    a.click();
}
function importAllData(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            if (data.members) AppData.members = data.members;
            if (data.events) AppData.events = data.events;
            if (data.attendances) AppData.attendances = data.attendances;
            if (data.repertoire) AppData.repertoire = data.repertoire;
            if (data.inventory) AppData.inventory = data.inventory;
            if (data.minutes) AppData.minutes = data.minutes;
            if (data.programme) AppData.programme = data.programme;
            if (data.massPrograms) AppData.massPrograms = data.massPrograms;
            saveAll();
            loadData();
            renderView();
            notifyChange('données', 'modification', 'Données importées avec succès');
            alert(_('importSuccess'));
        } catch(ex) { alert('Fichier invalide.'); }
    };
    reader.readAsText(file);
}
function resetAllData() {
    if (confirm(_('resetConfirm'))) {
        Object.values(STORAGE).forEach(k => localStorage.removeItem(k));
        localStorage.removeItem('theme');
        location.reload();
    }
}

function initAttendanceFromStorage() {
    currentAttendance = {};
    if (!selectedEventId) return;
    AppData.attendances.filter(a => a.event_id === selectedEventId).forEach(a => {
        currentAttendance[a.member_id] = { status: a.status, motif: a.motif || '' };
    });
}

// ---------- NAVIGATION ----------
function buildNavigation() {
    const navItems = [
        { view: 'dashboard', icon: 'fa-th-large', i18n: 'dashboard' },
        { view: 'repertoire', icon: 'fa-book-open', i18n: 'repertoire' },
        { view: 'secretariat', icon: 'fa-briefcase', i18n: 'secretariat' },
        { view: 'mass', icon: 'fa-church', i18n: 'mass' },
        { view: 'settings', icon: 'fa-cog', i18n: 'settings' },
    ];
    document.getElementById('sidebarNav').innerHTML = navItems.map(item =>
        `<a href="#" onclick="navigateTo('${item.view}')" class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 transition-colors" data-view="${item.view}"><i class="fas ${item.icon} w-5 text-center"></i> <span>${_(item.i18n)}</span></a>`
    ).join('');
    document.getElementById('bottomNav').innerHTML = navItems.map(item =>
        `<button onclick="navigateTo('${item.view}')" class="flex flex-col items-center text-xs nav-item-mobile mx-1" data-view="${item.view}"><i class="fas ${item.icon} text-lg"></i> <span>${_(item.i18n)}</span></button>`
    ).join('');
}

function navigateTo(view) {
    currentView = view;
    renderView();
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('bg-slate-700', 'text-yellow-400'));
    document.querySelectorAll('.nav-item-mobile').forEach(el => el.classList.remove('text-yellow-400'));
    const d = document.querySelector(`.nav-item[data-view="${view}"]`);
    const m = document.querySelector(`.nav-item-mobile[data-view="${view}"]`);
    if (d) d.classList.add('bg-slate-700', 'text-yellow-400');
    if (m) m.classList.add('text-yellow-400');
    if (window.innerWidth < 1024) {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.add('hidden');
    }
}

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('hidden'); }
function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarOverlay').classList.remove('hidden'); }

// ---------- RENDU PRINCIPAL ----------
function renderView() {
    const main = document.getElementById('mainContent');
    switch (currentView) {
        case 'dashboard': main.innerHTML = renderDashboard(); break;
        case 'repertoire': main.innerHTML = renderRepertoire(); break;
        case 'secretariat': main.innerHTML = renderSecretariat(); break;
        case 'mass': main.innerHTML = renderMassPage(); break;
        case 'settings': main.innerHTML = renderSettings(); break;
        default: main.innerHTML = renderDashboard();
    }
}

// ---------- DASHBOARD ----------
function renderDashboard() {
    const nb = AppData.members.length;
    const nextEv = AppData.events.sort((a,b)=> new Date(a.event_date) - new Date(b.event_date)).find(e => new Date(e.event_date) >= new Date()) || AppData.events[AppData.events.length-1];
    const totalRep = Object.values(AppData.repertoire).flat().length;
    const today = new Date().toISOString().split('T')[0];
    const todayProg = AppData.programme.filter(p => p.date === today);
    return `
    <div class="mb-6 flex items-center justify-between">
        <h2 class="text-2xl font-bold">${_('dashboard')}</h2>
        <button onclick="openSidebar()" class="lg:hidden text-slate-700 text-2xl"><i class="fas fa-bars"></i></button>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
        <div class="bg-white p-5 rounded-xl shadow-sm border">
            <div class="flex items-center gap-3 text-blue-600"><i class="fas fa-users text-2xl"></i><span>${_('choirMembers')}</span></div>
            <p class="text-3xl font-bold mt-2">${nb}</p>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border">
            <div class="flex items-center gap-3 text-yellow-600"><i class="fas fa-calendar-alt text-2xl"></i><span>${_('nextEvent')}</span></div>
            <p class="text-xl font-bold mt-2">${nextEv?.title || _('noData')}</p>
            <p class="text-sm text-gray-500">${nextEv?.event_date || ''} - ${nextEv?.location || ''}</p>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border">
            <div class="flex items-center gap-3 text-green-600"><i class="fas fa-book-open text-2xl"></i><span>${_('repertoire')}</span></div>
            <p class="text-3xl font-bold mt-2">${totalRep} ${_('repertoireCount')}</p>
        </div>
    </div>
    <div class="bg-white rounded-xl shadow-sm border p-4 mb-6">
        <div class="flex justify-between items-center mb-3">
            <h3 class="text-lg font-bold"><i class="fas fa-list-ul mr-2"></i>${_('programmeToday')} (${new Date().toLocaleDateString('fr-FR')})</h3>
            <button onclick="openAddProgrammeModal()" class="text-blue-600"><i class="fas fa-plus-circle"></i> ${_('add')}</button>
        </div>
        ${todayProg.length === 0 ? `<p class="text-gray-500 italic">${_('noData')}</p>` : todayProg.map(p => `
        <div class="flex justify-between items-center border-b py-2">
            <span><strong>${p.title}</strong> - ${p.details || ''}</span>
            <button onclick="deleteProgramme(${p.id})" class="text-red-500"><i class="fas fa-trash"></i></button>
        </div>`).join('')}
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <button onclick="navigateTo('secretariat')" class="bg-white p-4 rounded-xl shadow-sm border hover:shadow-md text-left"><i class="fas fa-user-check text-blue-500 text-xl block mb-1"></i>${_('secretariat')}</button>
        <button onclick="navigateTo('repertoire')" class="bg-white p-4 rounded-xl shadow-sm border hover:shadow-md text-left"><i class="fas fa-music text-green-500 text-xl block mb-1"></i>${_('repertoire')}</button>
        <button onclick="navigateTo('mass')" class="bg-white p-4 rounded-xl shadow-sm border hover:shadow-md text-left"><i class="fas fa-church text-purple-500 text-xl block mb-1"></i>${_('mass')}</button>
        <button onclick="navigateTo('settings')" class="bg-white p-4 rounded-xl shadow-sm border hover:shadow-md text-left"><i class="fas fa-cog text-indigo-500 text-xl block mb-1"></i>${_('settings')}</button>
    </div>`;
}

// ---------- RÉPERTOIRE ----------
function renderRepertoire() {
    const tabs = ['Messes', 'Chants Communion', 'Offertoires', 'High life', 'Acclamations'];
    const tabKeys = ['repertoireTab_messes', 'repertoireTab_communion', 'repertoireTab_offertoires', 'repertoireTab_highlife', 'repertoireTab_acclamations'];
    const chants = AppData.repertoire[currentRepertoireTab] || [];

function saveChant(chant, editChant) {

    saveAll(); closeModal(); renderView();
    notifyChange('chant', isNew ? 'ajout' : 'modification', chant.title);

                        <td class="p-3"><span class="px-2 py-0.5 rounded-full text-xs ${m.pupitre === 'Soprano' ? 'bg-pink-200 text-pink-800' : m.pupitre === 'Alto' ? 'bg-indigo-200 text-indigo-800' : m.pupitre === 'Ténor' ? 'bg-teal-200 text-teal-800' : 'bg-amber-200 text-amber-800'}">${m.pupitre}</span></td>

                            </select>
                        </td>

                    </tr>`;

    <div class="mt-4 text-right"><button onclick="saveAttendance()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700"><i class="fas fa-save mr-2"></i> ${_('saveAttendance')}</button></div>`}`;
    return html;
}
function changeEvent(id) { selectedEventId = parseInt(id); initAttendanceFromStorage(); renderView(); }
function setAttendance(memberId, status) {
    if (!currentAttendance[memberId]) currentAttendance[memberId] = { status, motif: '' };
    else currentAttendance[memberId].status = status;
}
function updateMotif(memberId, motif) {
    if (!currentAttendance[memberId]) currentAttendance[memberId] = { status: 'Présent', motif: '' };
    currentAttendance[memberId].motif = motif;
}
function saveAttendance() {
    for (let mId in currentAttendance) {
        const existing = AppData.attendances.find(a => a.event_id === selectedEventId && a.member_id == mId);
        if (existing) { existing.status = currentAttendance[mId].status; existing.motif = currentAttendance[mId].motif; }
        else AppData.attendances.push({ id: Date.now()+Math.random(), event_id: selectedEventId, member_id: parseInt(mId), status: currentAttendance[mId].status, motif: currentAttendance[mId].motif });
    }
    saveAll();
    notifyChange('présence', 'modification', 'Feuille de présence enregistrée');
    alert(_('saveAttendance'));
}

        <textarea name="details" placeholder="${_('details')}" class="w-full border p-2 rounded-lg" rows="3">${data.details || ''}</textarea>
        <div class="flex justify-end gap-3"><button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 rounded-lg">${_('cancel')}</button><button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg">${_('save')}</button></div>
    </form>`;
    openModal(modal);
    document.getElementById('eventForm').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const newEv = {
            id: ev ? ev.id : Date.now(),
            title: isEdit ? fd.get('title') : `${fd.get('type')} du ${fd.get('event_date')}`,
            type: fd.get('type'), event_date: fd.get('event_date'), heure: fd.get('heure'),
            paroisse: fd.get('paroisse'), quartier: fd.get('quartier'), details: fd.get('details')
        };
        if (ev) { const idx = AppData.events.findIndex(e => e.id === ev.id); if (idx !== -1) AppData.events[idx] = newEv; }
        else AppData.events.push(newEv);

        notifyChange('événement', ev ? 'modification' : 'ajout', newEv.title);

function deleteEvent(id) {
    if (confirm(_('confirm'))) {
        const ev = AppData.events.find(e => e.id === id);

        AppData.attendances = AppData.attendances.filter(a => a.event_id !== id);
        if (selectedEventId === id) selectedEventId = AppData.events.length > 0 ? AppData.events[0].id : null;
        saveAll(); initAttendanceFromStorage(); renderView();
        notifyChange('événement', 'suppression', ev?.title || '');
    }
}

    </div>
    <div class="space-y-4">
        ${programmes.length === 0 ? `<p class="text-gray-500 italic">${_('noData')}</p>` : programmes.map(p => `
        <div class="bg-white p-4 rounded-xl shadow-sm border">
            <div class="flex justify-between items-start">
                <div><h3 class="font-bold text-lg">${p.title}</h3><p class="text-sm text-gray-500">${p.date} - ${p.details || _('noData')}</p></div>
                <div class="flex gap-2">
                    <button onclick="openAddProgrammeModal(${JSON.stringify(p).replace(/"/g, '&quot;')})" class="text-blue-600"><i class="fas fa-edit"></i></button>
                    <button onclick="deleteProgramme(${p.id})" class="text-red-500"><i class="fas fa-trash"></i></button>
                </div>
            </div>
        </div>`).join('')}
    </div>`;
}
function openAddProgrammeModal(editProg = null) {
    const prog = editProg || { title: '', details: '', date: new Date().toISOString().split('T')[0] };
    const modal = `
    <h2 class="text-xl font-bold mb-4">${editProg ? _('editProgramme') : _('addProgramme')}</h2>
    <form id="progForm" class="space-y-3">
        <input type="text" name="title" placeholder="${_('title')}" value="${prog.title}" required class="w-full border p-2 rounded-lg">
        <textarea name="details" placeholder="${_('details')}" class="w-full border p-2 rounded-lg" rows="3">${prog.details || ''}</textarea>
        <input type="date" name="date" value="${prog.date}" required class="w-full border p-2 rounded-lg">
        <div class="flex justify-end gap-3"><button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 rounded-lg">${_('cancel')}</button><button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg">${_('save')}</button></div>
    </form>`;
    openModal(modal);
    document.getElementById('progForm').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const data = { id: editProg ? editProg.id : Date.now(), title: fd.get('title'), details: fd.get('details'), date: fd.get('date') };
        if (editProg) { const idx = AppData.programme.findIndex(p => p.id === editProg.id); if (idx !== -1) AppData.programme[idx] = data; }
        else AppData.programme.push(data);
        saveAll(); closeModal(); renderView();
        notifyChange('programme', editProg ? 'modification' : 'ajout', data.title);
    };
}
function deleteProgramme(id) {
    if (confirm(_('confirm'))) { 
        const prog = AppData.programme.find(p => p.id === id);
        AppData.programme = AppData.programme.filter(p => p.id !== id); 
        saveAll(); renderView();
        notifyChange('programme', 'suppression', prog?.title || '');
    }
}

// ---------- MESSE (avec notification) ----------
function renderMassPage() {
    const programs = [...AppData.massPrograms].sort((a,b) => new Date(b.date) - new Date(a.date));
    let html = `
    <div class="mb-6 flex items-center justify-between"><h2 class="text-2xl font-bold">${_('mass')}</h2><button onclick="openSidebar()" class="lg:hidden text-slate-700 text-2xl"><i class="fas fa-bars"></i></button></div>
    <div class="mb-4 flex justify-between items-center">
        <span class="text-gray-600">${programs.length} programme(s)</span>
        <button onclick="openAddMassProgramModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700"><i class="fas fa-plus mr-1"></i> ${_('addMass')}</button>
    </div>
    <div class="space-y-4">`;
    programs.forEach(p => {
        html += `<div class="bg-white p-4 rounded-xl shadow-sm border">
            <div class="flex justify-between items-start">
                <div>
                    <h3 class="font-bold text-lg">Messe du ${p.date} ${p.title ? '- ' + p.title : ''}</h3>
                    <p class="text-sm text-gray-600 truncate">${_('massProcession')}: ${p.procession || '-'} | ${_('massCommunion')}: ${p.communion || '-'}</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="openEditMassProgramModal(${p.id})" class="text-blue-600"><i class="fas fa-edit"></i></button>
                    <button onclick="deleteMassProgram(${p.id})" class="text-red-500"><i class="fas fa-trash"></i></button>
                </div>
            </div>
        </div>`;
    });
    html += `</div>`;
    return html;
}
function openAddMassProgramModal() { openEditMassProgramModal(null); }
function openEditMassProgramModal(progId) {
    const prog = progId ? AppData.massPrograms.find(p => p.id === progId) : null;
    const data = prog || { date: new Date().toISOString().split('T')[0], title: '', procession: '', entree: '', kyrie: '', gloria: '', psaume: '', acclamation: '', epiclese: '', credo: '', pu: '', offrande: '', sanctus: '', agnus_dei: '', communion: '', quete_construction: '', envoi: '' };
    const fields = [
        ['massProcession','procession'], ['massEntree','entree'], ['massKyrie','kyrie'], ['massGloria','gloria'], ['massPsaume','psaume'],
        ['massAcclamation','acclamation'], ['massEpiclese','epiclese'], ['massCredo','credo'], ['massPU','pu'],
        ['massOffrande','offrande'], ['massSanctus','sanctus'], ['massAgnusDei','agnus_dei'], ['massCommunion','communion'],
        ['massQuete','quete_construction'], ['massEnvoi','envoi']
    ];
    const modal = `
    <h2 class="text-xl font-bold mb-4">${prog ? _('editMass') : _('addMass')}</h2>
    <form id="massForm" class="space-y-3">
        <div class="grid grid-cols-2 gap-2">
            <input type="date" name="date" value="${data.date}" required class="w-full border p-2 rounded-lg">
            <input type="text" name="title" placeholder="${_('title')}" value="${data.title}" class="w-full border p-2 rounded-lg">
        </div>
        <div class="space-y-2 text-sm">
            ${fields.map(([labelKey, name]) => `<div><label class="block font-medium text-gray-700">🔥 ${_(labelKey)}</label><input type="text" name="${name}" value="${data[name] || ''}" class="w-full border p-2 rounded-lg mt-1" placeholder="${_(labelKey)}..."></div>`).join('')}
        </div>
        <div class="flex justify-end gap-3"><button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 rounded-lg">${_('cancel')}</button><button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg">${_('save')}</button></div>
    </form>`;
    openModal(modal);
    document.getElementById('massForm').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const newProg = { id: prog ? prog.id : Date.now(), date: fd.get('date'), title: fd.get('title') };
        fields.forEach(([_, name]) => newProg[name] = fd.get(name));
        if (prog) { const idx = AppData.massPrograms.findIndex(p => p.id === prog.id); if (idx !== -1) AppData.massPrograms[idx] = newProg; }
        else AppData.massPrograms.push(newProg);
        saveAll(); closeModal(); renderView();
        notifyChange('messe', prog ? 'modification' : 'ajout', newProg.title || `Messe du ${newProg.date}`);
    };
}
function deleteMassProgram(id) {
    if (confirm(_('confirm'))) { 
        const prog = AppData.massPrograms.find(p => p.id === id);
        AppData.massPrograms = AppData.massPrograms.filter(p => p.id !== id); 
        saveAll(); renderView();
        notifyChange('messe', 'suppression', prog?.title || '');
    }
}

// ---------- PARAMÈTRES ----------
function renderSettings() {
    return `
    <div class="mb-6 flex items-center justify-between"><h2 class="text-2xl font-bold">${_('settings')}</h2><button onclick="openSidebar()" class="lg:hidden text-slate-700 text-2xl"><i class="fas fa-bars"></i></button></div>
    <div class="bg-white rounded-xl shadow-sm border p-6 space-y-6 max-w-md">
        <div>
            <label class="block font-medium mb-2">${_('darkMode')}</label>
            <select id="themeSelect" onchange="setTheme(this.value)" class="border rounded p-2 w-full">
                <option value="system" ${(!themePref || themePref==='system')?'selected':''}>${_('themeSystem')}</option>
                <option value="light" ${themePref==='light'?'selected':''}>${_('themeLight')}</option>
                <option value="dark" ${themePref==='dark'?'selected':''}>${_('themeDark')}</option>
            </select>
        </div>
        <div>
            <label class="block font-medium mb-2">${_('notifications')}</label>
            <div class="flex gap-2">
                <button onclick="requestNotificationPermission()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">${_('enableNotifications')}</button>
                <button onclick="notificationsEnabled=false;localStorage.setItem('notifications','false');showToast('Notifications','Désactivées')" class="bg-gray-400 text-white px-4 py-2 rounded-lg text-sm">${_('disableNotifications')}</button>
            </div>
            <p class="text-xs text-gray-500 mt-2">${notificationsEnabled ? _('notificationsEnabled') : _('notificationsDisabled')}</p>
        </div>
        <button onclick="exportAllData()" class="w-full bg-blue-600 text-white py-2 rounded mb-2"><i class="fas fa-download mr-2"></i>${_('exportData')}</button>
        <label class="w-full bg-gray-200 py-2 rounded cursor-pointer block text-center"><i class="fas fa-upload mr-2"></i>${_('importData')}<input type="file" accept=".json" onchange="importAllData(this.files[0])" class="hidden"></label>
        <button onclick="resetAllData()" class="w-full bg-red-600 text-white py-2 rounded"><i class="fas fa-trash-alt mr-2"></i>${_('resetData')}</button>
    </div>`;
}

// ---------- MODAL ----------
function openModal(content) { document.getElementById('modalContent').innerHTML = content; document.getElementById('modal').classList.remove('hidden'); document.getElementById('modal').classList.add('flex'); }
function closeModal() { document.getElementById('modal').classList.add('hidden'); document.getElementById('modal').classList.remove('flex'); }
document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

// ---------- INITIALISATION ----------
function initApp() {
    loadData();
    buildNavigation();
    navigateTo('dashboard');
    
    // Vérifier les notifications au démarrage
    setTimeout(() => {
        if (notificationsEnabled && Notification.permission === 'granted') {
            checkNotifications();
            setInterval(checkNotifications, 3600000); // Toutes les heures
        }
    }, 3000);
}

window.addEventListener('resize', () => {
    if (window.innerWidth >= 1024) {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.add('hidden');
    }
});

initApp();
</script>
</body>
</html>
