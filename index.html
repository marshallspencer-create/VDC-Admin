<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>VDC Admin</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VDC Admin">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="apple-touch-icon" href="logo.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #f8fafc; --text: #1e293b; }
        html.dark { --bg: #1e293b; --text: #e2e8f0; }
        body { background-color: var(--bg); color: var(--text); }
        .sidebar { transition: transform 0.3s ease; }
        @media (max-width: 1023px) {
            .sidebar { transform: translateX(-100%); position: fixed; z-index: 50; height: 100%; }
            .sidebar.open { transform: translateX(0); }
        }
        .modal { transition: opacity 0.2s ease; }
        .bottom-nav { background-color: #1e293b; }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #1e40af; font-weight: 600; }
        html.dark .tab-active { color: #93c5fd; border-color: #60a5fa; }
        html.dark .bg-white { background-color: #334155; }
        html.dark .text-gray-800, html.dark .text-slate-800 { color: #e2e8f0; }
        html.dark .text-gray-600 { color: #cbd5e1; }
        html.dark .text-gray-500 { color: #94a3b8; }
        html.dark .border { border-color: #475569; }
        html.dark .bg-gray-50 { background-color: #1e293b; }
        html.dark .bg-slate-800 { background-color: #0f172a; }
    </style>
</head>
<body class="font-sans antialiased" id="appBody">

<div id="sidebarOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden" onclick="toggleSidebar()"></div>

<aside id="sidebar" class="sidebar fixed top-0 left-0 h-full w-64 bg-slate-800 text-white flex flex-col shadow-xl z-50 lg:translate-x-0 lg:static lg:z-auto transform -translate-x-full">
    <div class="p-5 border-b border-slate-700">
        <h1 class="text-xl font-bold text-yellow-400 flex items-center gap-2"><i class="fas fa-crown"></i> VDC Admin</h1>
        <p class="text-xs text-slate-400 mt-1">Secrétariat & Maîtres de Chœur</p>
    </div>
    <nav class="flex-1 p-4 space-y-2" id="sidebarNav"></nav>
    <div class="p-4 border-t border-slate-700 text-xs text-slate-400">© 2025 · VDC Admin</div>
</aside>

<nav class="bottom-nav fixed bottom-0 left-0 right-0 z-50 lg:hidden flex justify-around items-center py-2 border-t border-slate-700 text-white shadow-lg overflow-x-auto" id="bottomNav"></nav>

<main id="mainContent" class="lg:ml-64 min-h-screen pb-24 lg:pb-8 px-4 md:px-8 py-6 transition-all duration-300"></main>

<div id="modal" class="modal fixed inset-0 z-50 hidden items-center justify-center bg-black bg-opacity-60 p-4">
    <div class="bg-white dark:bg-slate-700 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
        <div class="p-6" id="modalContent"></div>
    </div>
</div>

<script>
// ---------- SUPABASE ----------
const SUPABASE_URL = 'https://tcyigckknvytckizymii.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjeWlnY2trbnZ5dGNraXp5bWlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNTYxMjYsImV4cCI6MjEwMTYzMjEyNn0.9nUkUOUeQgzsacH6bBIRY3Q6G23XaqkS3qqmdQK6IJ8';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------- VARIABLES ----------
let AppData = { members: [], events: [], attendances: [], repertoire: { 'Messes': [], 'Chants Communion': [], 'Offertoires': [], 'High life': [], 'Acclamations': [] }, inventory: [], minutes: [], programme: [], massPrograms: [] };
let user = null;
let currentView = 'dashboard';
let selectedEventId = null;
let currentRepertoireTab = 'Messes';
let currentSecretariatTab = 'attendance';
let authMode = 'login';
let currentAttendance = {};

// ---------- AUTH ----------
async function login(email, password) {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) { alert('Erreur : ' + error.message); return; }
    user = data.user;
    await loadData();
    listenToChanges();
    buildNavigation();
    navigateTo('dashboard');
}

async function register(email, password, fullName, poste) {
    const { data, error } = await supabase.auth.signUp({ email, password });
    if (error) { alert('Erreur : ' + error.message); return; }
    await supabase.from('profiles').upsert({ id: data.user.id, full_name: fullName, poste: poste, email: email });
    alert('✅ Compte créé ! Connectez-vous.');
    authMode = 'login';
    renderView();
}

async function logout() {
    await supabase.auth.signOut();
    user = null;
    document.getElementById('sidebarNav').innerHTML = '';
    document.getElementById('bottomNav').innerHTML = '';
    navigateTo('login');
}

// ---------- DONNÉES SUPABASE ----------
async function loadData() {
    const { data } = await supabase.from('app_data').select('data').eq('id', 1).single();
    if (data && data.data) AppData = data.data;
}

async function saveAll() {
    if (!user) return;
    await supabase.from('app_data').upsert({ id: 1, data: AppData });
}

function listenToChanges() {
    supabase.channel('app_data_channel')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_data', filter: 'id=eq.1' }, (payload) => {
            if (payload.new && payload.new.data) {
                AppData = payload.new.data;
                if (currentView !== 'login') renderView();
            }
        }).subscribe();
}

// ---------- THEME ----------
const themePref = localStorage.getItem('theme');
const systemDark = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
    let theme = themePref || 'system';
    let isDark = theme === 'system' ? systemDark.matches : theme === 'dark';
    document.documentElement.classList.toggle('dark', isDark);
}
systemDark.addEventListener('change', () => { if (!themePref || themePref === 'system') applyTheme(); });
function setTheme(theme) { localStorage.setItem('theme', theme); applyTheme(); }
applyTheme();

// ---------- NAVIGATION ----------
function buildNavigation() {
    if (!user) return;
    const items = [
        { view: 'dashboard', icon: 'fa-th-large', label: 'Tableau de bord' },
        { view: 'repertoire', icon: 'fa-book-open', label: 'Répertoire' },
        { view: 'secretariat', icon: 'fa-briefcase', label: 'Secrétariat' },
        { view: 'mass', icon: 'fa-church', label: 'Messe' },
        { view: 'settings', icon: 'fa-cog', label: 'Paramètres' },
    ];
    document.getElementById('sidebarNav').innerHTML = items.map(i =>
        `<a href="#" onclick="navigateTo('${i.view}')" class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 transition-colors"><i class="fas ${i.icon} w-5 text-center"></i> ${i.label}</a>`
    ).join('');
    document.getElementById('bottomNav').innerHTML = items.map(i =>
        `<button onclick="navigateTo('${i.view}')" class="flex flex-col items-center text-xs mx-1"><i class="fas ${i.icon} text-lg"></i> ${i.label}</button>`
    ).join('');
}

function navigateTo(view) {
    currentView = view;
    renderView();
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('bg-slate-700', 'text-yellow-400'));
    document.querySelectorAll('.nav-item-mobile').forEach(el => el.classList.remove('text-yellow-400'));
}

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('hidden'); }
function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarOverlay').classList.remove('hidden'); }

// ---------- RENDU PRINCIPAL ----------
function renderView() {
    const main = document.getElementById('mainContent');
    if (!user) {
        main.innerHTML = authMode === 'login' ? renderLogin() : renderRegister();
        return;
    }
    switch (currentView) {
        case 'dashboard': main.innerHTML = renderDashboard(); break;
        case 'repertoire': main.innerHTML = renderRepertoire(); break;
        case 'secretariat': main.innerHTML = renderSecretariat(); break;
        case 'mass': main.innerHTML = renderMassPage(); break;
        case 'settings': main.innerHTML = renderSettings(); break;
        default: main.innerHTML = renderDashboard();
    }
}

// ---------- ÉCRAN CONNEXION ----------
function renderLogin() {
    return `<div class="flex items-center justify-center min-h-[70vh]">
        <div class="bg-white dark:bg-slate-700 rounded-xl shadow-lg p-6 max-w-sm w-full">
            <div class="text-center mb-6"><i class="fas fa-crown text-yellow-400 text-4xl mb-2"></i><h2 class="text-xl font-bold">VDC Admin</h2></div>
            <form onsubmit="event.preventDefault();login(document.getElementById('authEmail').value,document.getElementById('authPassword').value)" class="space-y-3">
                <input type="email" id="authEmail" placeholder="Email" required class="w-full border p-2 rounded dark:bg-slate-600 dark:border-slate-500">
                <input type="password" id="authPassword" placeholder="Mot de passe" required class="w-full border p-2 rounded dark:bg-slate-600 dark:border-slate-500">
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Connexion</button>
            </form>
            <p class="mt-3 text-sm text-center"><a href="#" onclick="authMode='register';renderView()" class="text-blue-600 hover:underline">Créer un compte</a></p>
        </div></div>`;
}

function renderRegister() {
    return `<div class="flex items-center justify-center min-h-[70vh]">
        <div class="bg-white dark:bg-slate-700 rounded-xl shadow-lg p-6 max-w-sm w-full">
            <div class="text-center mb-6"><i class="fas fa-crown text-yellow-400 text-4xl mb-2"></i><h2 class="text-xl font-bold">Inscription</h2></div>
            <form onsubmit="event.preventDefault();register(document.getElementById('authEmail').value,document.getElementById('authPassword').value,document.getElementById('authName').value,document.getElementById('authPoste').value)" class="space-y-3">
                <input type="text" id="authName" placeholder="Nom et Prénom" required class="w-full border p-2 rounded dark:bg-slate-600 dark:border-slate-500">
                <select id="authPoste" required class="w-full border p-2 rounded dark:bg-slate-600 dark:border-slate-500">
                    <option value="">Poste</option><option>Maître de chœur</option><option>Membre du bureau</option>
                </select>
                <input type="email" id="authEmail" placeholder="Email" required class="w-full border p-2 rounded dark:bg-slate-600 dark:border-slate-500">
                <input type="password" id="authPassword" placeholder="Mot de passe (6+ car.)" required class="w-full border p-2 rounded dark:bg-slate-600 dark:border-slate-500">
                <button type="submit" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">S'inscrire</button>
            </form>
            <p class="mt-3 text-sm text-center"><a href="#" onclick="authMode='login';renderView()" class="text-blue-600 hover:underline">Déjà un compte ?</a></p>
        </div></div>`;
}

// ---------- DASHBOARD ----------
function renderDashboard() {
    const nb = AppData.members.length;
    const totalRep = Object.values(AppData.repertoire).flat().length;
    const nextEv = AppData.events.sort((a,b)=> new Date(a.event_date) - new Date(b.event_date)).find(e => new Date(e.event_date) >= new Date()) || AppData.events[AppData.events.length-1];
    return `
    <h2 class="text-2xl font-bold mb-6">Tableau de bord</h2>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
        <div class="bg-white dark:bg-slate-700 p-5 rounded-xl shadow-sm border dark:border-slate-600"><p class="text-3xl font-bold">${nb}</p><p>Choristes</p></div>
        <div class="bg-white dark:bg-slate-700 p-5 rounded-xl shadow-sm border dark:border-slate-600"><p class="text-xl font-bold">${nextEv?.title||'Aucun'}</p><p>${nextEv?.event_date||''}</p></div>
        <div class="bg-white dark:bg-slate-700 p-5 rounded-xl shadow-sm border dark:border-slate-600"><p class="text-3xl font-bold">${totalRep}</p><p>Chants</p></div>
    </div>`;
}

// ---------- RÉPERTOIRE ----------
function renderRepertoire() {
    const tabs = ['Messes', 'Chants Communion', 'Offertoires', 'High life', 'Acclamations'];
    const chants = AppData.repertoire[currentRepertoireTab] || [];
    let html = `<h2 class="text-2xl font-bold mb-6">Répertoire</h2>
    <div class="flex flex-wrap gap-2 mb-4">${tabs.map(t=>`<button onclick="currentRepertoireTab='${t}';renderView()" class="px-3 py-1 rounded-full text-sm ${currentRepertoireTab===t?'bg-blue-600 text-white':'bg-gray-200 dark:bg-slate-600'}">${t}</button>`).join('')}</div>
    <button onclick="openAddChantModal()" class="bg-blue-600 text-white px-3 py-1.5 rounded text-sm mb-4">+ Ajouter</button>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">`;
    chants.forEach(c => {
        html += `<div class="bg-white dark:bg-slate-700 p-4 rounded-xl shadow-sm border dark:border-slate-600"><h3 class="font-bold">${c.title}</h3><p class="text-sm text-gray-500">${c.status||'A étudier'}</p></div>`;
    });
    html += `</div>`;
    return html;
}

function openAddChantModal() {
    const modal = `
    <h2 class="text-xl font-bold mb-4">Ajouter un chant</h2>
    <form id="chantForm" class="space-y-3">
        <input type="text" name="title" placeholder="Titre" required class="w-full border p-2 rounded dark:bg-slate-600">
        <div class="flex justify-end gap-3"><button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 rounded">Annuler</button><button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded">Enregistrer</button></div>
    </form>`;
    openModal(modal);
    document.getElementById('chantForm').onsubmit = function(e) {
        e.preventDefault();
        AppData.repertoire[currentRepertoireTab].push({ id: Date.now(), title: new FormData(e.target).get('title'), status: 'A étudier' });
        saveAll(); closeModal(); renderView();
    };
}

// ---------- SECRÉTARIAT ----------
function renderSecretariat() {
    const tabs = ['Liste de présence', 'Événements', 'Inventaire', 'PV', 'Programme'];
    const keys = ['attendance', 'events', 'inventory', 'pv', 'programme'];
    return `
    <h2 class="text-2xl font-bold mb-6">Secrétariat</h2>
    <div class="flex flex-wrap gap-2 mb-4">${tabs.map((t,i)=>`<button onclick="currentSecretariatTab='${keys[i]}';renderView()" class="px-3 py-1 rounded-full text-sm ${currentSecretariatTab===keys[i]?'bg-blue-600 text-white':'bg-gray-200 dark:bg-slate-600'}">${t}</button>`).join('')}</div>
    <p class="text-gray-500">Ajoutez des membres, événements, matériel et PV.</p>
    <button onclick="openAddMemberModal()" class="bg-green-600 text-white px-3 py-1.5 rounded text-sm mt-4">+ Ajouter un membre</button>
    <div class="mt-4 space-y-2">${AppData.members.map(m=>`<div class="bg-white dark:bg-slate-700 p-3 rounded shadow-sm"><strong>${m.fullName}</strong> - ${m.pupitre}</div>`).join('')}</div>`;
}

function openAddMemberModal() {
    const modal = `
    <h2 class="text-xl font-bold mb-4">Ajouter un membre</h2>
    <form id="memberForm" class="space-y-3">
        <input type="text" name="fullName" placeholder="Nom et Prénom" required class="w-full border p-2 rounded dark:bg-slate-600">
        <select name="pupitre" required class="w-full border p-2 rounded dark:bg-slate-600"><option value="">Pupitre</option><option>Soprano</option><option>Alto</option><option>Ténor</option><option>Basse</option></select>
        <div class="flex justify-end gap-3"><button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 rounded">Annuler</button><button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded">Ajouter</button></div>
    </form>`;
    openModal(modal);
    document.getElementById('memberForm').onsubmit = function(e) {
        e.preventDefault();
        const fd = new FormData(e.target);
        AppData.members.push({ id: Date.now(), fullName: fd.get('fullName'), pupitre: fd.get('pupitre') });
        saveAll(); closeModal(); renderView();
    };
}

// ---------- MESSE ----------
function renderMassPage() {
    return `<h2 class="text-2xl font-bold mb-6">Messe</h2><p class="text-gray-500">Programmes de messe à venir.</p>`;
}

// ---------- PARAMÈTRES ----------
function renderSettings() {
    return `
    <h2 class="text-2xl font-bold mb-6">Paramètres</h2>
    <div class="bg-white dark:bg-slate-700 rounded-xl shadow-sm border dark:border-slate-600 p-6 space-y-4 max-w-md">
        <select onchange="setTheme(this.value)" class="border rounded p-2 w-full dark:bg-slate-600">
            <option value="system" ${(!themePref||themePref==='system')?'selected':''}>Thème : Système</option>
            <option value="light" ${themePref==='light'?'selected':''}>Thème : Clair</option>
            <option value="dark" ${themePref==='dark'?'selected':''}>Thème : Sombre</option>
        </select>
        <button onclick="logout()" class="w-full bg-red-600 text-white py-2 rounded">Déconnexion</button>
    </div>`;
}

// ---------- MODAL ----------
function openModal(content) { document.getElementById('modalContent').innerHTML = content; document.getElementById('modal').classList.remove('hidden'); document.getElementById('modal').classList.add('flex'); }
function closeModal() { document.getElementById('modal').classList.add('hidden'); document.getElementById('modal').classList.remove('flex'); }
document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

// ---------- INIT ----------
(async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (session?.user) {
        user = session.user;
        await loadData();
        listenToChanges();
        buildNavigation();
    }
    navigateTo(user ? 'dashboard' : 'login');
})();
</script>
</body>
</html>
